name: Daily Forex YouTube Video

on:
  schedule:
    # 3 posts per day: 7am, 1pm, 7pm Lagos/UK time (6am, 12pm, 6pm UTC)
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Step 1 — Generate educational scripts (3 Shorts)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_script.py

      - name: Step 2 — Render 3 Shorts videos with voiceover
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/render_video.py

      - name: Step 3 — Upload all 3 Shorts to YouTube
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: python scripts/upload_to_youtube.py

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-${{ github.run_id }}
          path: |
            data/video_content.json
            data/upload_results.json
            output/
          retention-days: 3
