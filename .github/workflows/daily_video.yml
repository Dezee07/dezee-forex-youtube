name: Daily Forex YouTube Video

on:
  schedule:
    # Runs at 6:00 AM UTC every day (7 AM UK / 8 AM Lagos time)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (ffmpeg for video rendering)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Step 1 — Fetch latest COT data from CFTC
        run: python scripts/fetch_cot_data.py

      - name: Step 2 — Generate video script using Claude AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_script.py

      - name: Step 3 — Render video (slideshow + voiceover)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/render_video.py

      - name: Step 4 — Upload to YouTube
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: python scripts/upload_to_youtube.py

      - name: Save output artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-output-${{ github.run_id }}
          path: |
            data/cot_latest.json
            data/video_content.json
            data/upload_results.json
            output/longform.mp4
            output/shorts.mp4
          retention-days: 7
